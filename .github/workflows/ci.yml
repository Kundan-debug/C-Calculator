name: C Calculator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GCC
        run: sudo apt-get update && sudo apt-get install -y gcc make

      - name: Build calculator
        run: make

      - name: Run tests
        run: make test
